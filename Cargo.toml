[package]
name = "highrise-rs"
version = "0.1.8"
edition = "2021"
description = "Fast async Rust SDK and MCP server for the Highrise Bot WebSocket and Web REST APIs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/isaim0011/highrise-rs"
homepage = "https://github.com/isaim0011/highrise-rs"
keywords = ["highrise", "bot", "sdk", "websocket", "mcp"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
uuid = { version = "1.12", features = ["v4"] }
